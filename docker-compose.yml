version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: recovery-agent-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - JWT_[REDACTED_GENERIC_SECRET_3]=your-secret-key-here-change-in-production
      - PORT=3001
    volumes:
      - ./server/data:/app/data
    networks:
      - recovery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: recovery-agent-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - recovery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  recovery-network:
    driver: bridge

volumes:
  database:
    driver: local
